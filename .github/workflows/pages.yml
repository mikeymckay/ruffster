name: Deploy Ruffster Pages

on:
  workflow_run:
    workflows: [Build and test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out Ruffster
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js for the Pages quality check
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned site-check dependencies
        run: npm ci
      - name: Check accessibility before publishing
        run: npm run check:pages-a11y
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
