name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-obsolete-push-runs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel superseded main-branch runs
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              event: 'push',
              status: 'in_progress',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId || run.head_sha === context.sha) continue;
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              core.info(`Canceled superseded push run ${run.run_number} (${run.head_sha.slice(0, 8)}).`);
            }

  pages-accessibility:
    name: Check Pages accessibility and mobile overflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned site-check dependencies
        run: npm ci
      - name: Scan all Pages screens at desktop and phone sizes
        run: npm run check:pages-a11y

  windows-bundle-extractor:
    name: Test Windows installer archive extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test valid bundles and reject unsafe archives
        run: dotnet run --project native/windows/bundle-extractor-tests/FamilyActivity.BundleExtractor.Tests.csproj -c Release

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python scripts/run-tests.py

  windows-tests:
    name: Tests (Windows — ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: Parent report API
            files: test_parent_app.py
          - shard: Parent dashboard and key access
            files: test_dashboard.py test_key_vault.py
          - shard: Local report sharing
            files: test_local_share.py
          - shard: Website and contributor docs
            files: test_docs_site.py
          - shard: Agent and network sampling
            files: test_encrypted_agent.py test_encrypted_view.py test_encrypted_store.py test_browser_channel.py test_process_network.py test_status.py test_network_labels.py test_network_identity.py test_device_identity.py test_device_labels.py test_public_key_file.py
          - shard: Native setup and install
            files: test_windows.py test_windows_setup_source.py test_windows_package_smoke.py test_macos_install.py test_macos_launchd.py test_macos_setup_source.py
          - shard: Reports and shared foundations
            files: test_reports.py test_store.py test_school_schedule.py test_network.py test_network_settings.py test_parent_settings.py test_plaintext_migration.py test_macos.py test_website_categories.py test_run_tests.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        run: python -m pip install -e .
      - name: Run this Windows test shard
        run: python scripts/run-tests.py --files ${{ matrix.files }}

  windows-package-check:
    name: Build Windows preview (no artifact published)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [tests, windows-tests, windows-bundle-extractor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build and smoke-check Windows package
        shell: pwsh
        run: |
          $preview = Join-Path $env:RUNNER_TEMP 'FamilyActivityPreview'
          .\scripts\build-windows-preview.ps1 -OutputDirectory $preview
          if (Test-Path $preview) { Remove-Item $preview -Recurse -Force }
          if (Test-Path "$preview.zip") { Remove-Item "$preview.zip" -Force }

  macos-package-check:
    name: Build macOS preview (no artifact published)
    runs-on: macos-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Validate disposable per-user LaunchAgent lifecycle
        run: python scripts/validate-macos-install-flow.py
      - name: Build and smoke-check macOS app
        shell: bash
        run: |
          python_executable="$(python -c 'import sys; print(sys.executable)')"
          output_directory="${RUNNER_TEMP}/FamilyActivityPreview"
          ./scripts/build-macos-preview.sh "$python_executable" "$output_directory"
          rm -rf -- "$output_directory"
