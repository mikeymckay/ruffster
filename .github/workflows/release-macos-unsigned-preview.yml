name: Publish Mac family app

on:
  push:
    tags:
      - 'mac-preview-*'
      - 'mac-family-*'

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish Apple silicon family app
    # Match the standard hosted Apple-silicon runner already used by CI.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruffster and packaging dependencies
        run: python -m pip install -e '.[build]'
      - name: Run test suite
        run: python scripts/run-tests.py
      - name: Build and package unsigned Mac app
        shell: bash
        run: |
          output_directory="${RUNNER_TEMP}/RuffsterMacFamilyApp"
          python_executable="$(python -c 'import sys; print(sys.executable)')"
          source_commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF_NAME" == mac-family-* ]]; then
            export RUFFSTER_VERSION="${GITHUB_REF_NAME#mac-family-}"
          else
            export RUFFSTER_VERSION="${GITHUB_REF_NAME#mac-preview-}"
          fi
          ./scripts/package-macos-unsigned-preview.sh "$python_executable" "$output_directory" "$source_commit"
          echo "RUFFSTER_OUTPUT=$output_directory" >> "$GITHUB_ENV"
      - name: Publish Mac family release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == mac-family-* ]]; then
            version="${GITHUB_REF_NAME#mac-family-}"
            gh release create "$GITHUB_REF_NAME" \
              "$RUFFSTER_OUTPUT/Ruffster-Mac-Family-App-Apple-Silicon.dmg" \
              "$RUFFSTER_OUTPUT/Ruffster-Mac-Family-App-Apple-Silicon.dmg.sha256" \
              --verify-tag \
              --title "Ruffster for Mac ${version}" \
              --notes-file .github/MAC-FAMILY-RELEASE-NOTES.md
          else
            version="${GITHUB_REF_NAME#mac-preview-}"
            gh release create "$GITHUB_REF_NAME" \
              "$RUFFSTER_OUTPUT/Ruffster-Mac-Family-App-Apple-Silicon.dmg" \
              "$RUFFSTER_OUTPUT/Ruffster-Mac-Family-App-Apple-Silicon.dmg.sha256" \
              --verify-tag \
              --prerelease \
              --title "Ruffster for Mac family app ${version}" \
              --notes-file .github/UNSIGNED-MAC-PREVIEW-RELEASE-NOTES.md
          fi
