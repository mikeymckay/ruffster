name: Publish Mac family app

on:
  push:
    tags:
      - 'mac-preview-*'

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish Apple silicon preview
    # Match the standard hosted Apple-silicon runner already used by CI.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruffster and packaging dependencies
        run: python -m pip install -e '.[build]'
      - name: Run test suite
        run: python scripts/run-tests.py
      - name: Build and package unsigned preview
        shell: bash
        run: |
          output_directory="${RUNNER_TEMP}/RuffsterUnsignedPreview"
          python_executable="$(python -c 'import sys; print(sys.executable)')"
          source_commit="$(git rev-parse HEAD)"
          export RUFFSTER_VERSION="${GITHUB_REF_NAME#mac-preview-}"
          ./scripts/package-macos-unsigned-preview.sh "$python_executable" "$output_directory" "$source_commit"
          echo "PREVIEW_OUTPUT=$output_directory" >> "$GITHUB_ENV"
      - name: Publish GitHub family prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PREVIEW_OUTPUT/Ruffster-Mac-Family-App-Apple-Silicon.dmg" \
            "$PREVIEW_OUTPUT/Ruffster-Mac-Family-App-Apple-Silicon.dmg.sha256" \
            --verify-tag \
            --prerelease \
            --title "Ruffster for Mac family app ${GITHUB_REF_NAME#mac-preview-}" \
            --notes-file .github/UNSIGNED-MAC-PREVIEW-RELEASE-NOTES.md
